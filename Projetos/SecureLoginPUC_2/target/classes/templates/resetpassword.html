<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- O token vai na URL: não repassar a URL para outros sites via Referer -->
    <meta name="referrer" content="no-referrer">
    <title>Redefinir senha</title>
    <link rel="stylesheet" th:href="@{/css/login.css}">
    <script th:src="@{/js/stars.js}" defer></script>
</head>

<body>
<div class="login-container">
    <div class="login-image-logo-container">
        <img th:src="@{/images/apc-login-bg.png}" alt="Logo PUC Minas">
    </div>
    <div class="login-form">

        <!-- Link válido: formulário da nova senha -->
        <form th:if="${tokenValido}" th:action="@{/resetpassword}" method="post" class="login-form">
            <h4 class="login-title">Defina sua nova senha</h4>
            <p class="login-message login-message-error" th:if="${erro}" th:text="${erro}"></p>
            <input type="hidden" name="token" th:value="${token}">
            <input type="password" name="senha" placeholder="Nova senha (mín. 8, com letra e número)" minlength="8" required>
            <input type="password" name="confirmarSenha" placeholder="Confirme a nova senha" minlength="8" required>
            <div class="login-button-container">
                <button type="submit">Salvar nova senha</button>
            </div>
        </form>

        <!-- Link inválido, expirado ou já usado -->
        <div th:unless="${tokenValido}" class="login-form">
            <h4 class="login-title">Link inválido ou expirado</h4>
            <p class="login-redirect-options">
                Este link de recuperação não é mais válido.<br>
                <a th:href="@{/recoverpassword}">Solicitar um novo link</a>
            </p>
        </div>

    </div>
</div>
</body>

</html>
