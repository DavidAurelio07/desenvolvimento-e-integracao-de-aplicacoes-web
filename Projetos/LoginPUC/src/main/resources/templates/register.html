<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Registro</title>
    <link rel="stylesheet" th:href="@{/css/register.css}">
    <script th:src="@{/js/stars.js}" defer></script>
</head>
<body>
<div class="register-container">
    <div class="register-image-logo-container">
        <img th:src="@{/images/campus-fotoPUC.jpg}" alt="Logo PUC Minas">
    </div>

    <div class="register-form">
        <h2 class="register-title">Crie sua conta</h2>
        <ul class="register-errors" th:if="${erros}">
            <li th:each="erro : ${erros}" th:text="${erro}"></li>
        </ul>

        <form th:action="@{/register}" method="post">
            <input type="text" name="nome" placeholder="Nome completo" th:value="${nome}" required>
            <input type="email" name="email" placeholder="E-mail" th:value="${email}" required>
            <input type="text" name="cpf" placeholder="CPF" th:value="${cpf}" required>
            <input type="text" name="rg" placeholder="RG" th:value="${rg}" required>
            <input type="text" name="endereco" placeholder="Endereço" th:value="${endereco}" required>
            <input type="text" name="instituicao" placeholder="Instituição" th:value="${instituicao}" required>
            <input type="password" name="senha" placeholder="Senha (mín. 8, com letra e número)" minlength="8" required>
            <input type="password" name="confirmarSenha" placeholder="Confirme a senha" minlength="8" required>

            <div class="register-button-container">
                <button type="submit">Registrar</button>
            </div>
        </form>

        <div class="register-redirect-options">
            Já possui conta? <a th:href="@{/login}">Faça login</a>
        </div>
    </div>
</div>
</body>
</html>
