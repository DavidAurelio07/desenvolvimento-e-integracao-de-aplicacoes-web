<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <link rel="stylesheet" th:href="@{/css/login.css}">
    <script th:src="@{/js/stars.js}" defer></script>
</head>

<body>
<div class="login-recover-container">
    <div class="login-recover-image-logo-container">
        <img th:src="@{/images/LOGOPUC-SEMFUNDO.png}" alt="Logo PUC Minas">
    </div>
    <div class="login-form">
        <form th:action="@{/recoverpassword}" method="post" class="login-form">
            <h3 class="login-message-recover">Área de recuperação de  senha</h3>
            <h4 class="login-title">Digite o e-mail cadastrado:</h4>
            <p class="login-message login-message-success" th:if="${param.sent}">Se o e-mail estiver cadastrado, enviamos um link para redefinir sua senha. Confira também o spam.</p>
            <input type="email" id="email" name="email" placeholder="Digite seu email:" required>
            <div class="login-button-container">
                <button type="submit">Recuperar senha</button>
            </div>

            <p class="login-redirect-options">
                Lembrou sua senha? <a th:href="@{/login}" style="color: #E6EEF3; font-weight: bold; margin-left: 5px;">Faça login</a>
            </p>
        </form>
    </div>
</div>
</body>

</html>
