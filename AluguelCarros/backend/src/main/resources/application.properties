spring.application.name=AluguelCarros

# Credenciais reais ficam em local.properties (não versionado)
spring.config.import=optional:classpath:local.properties

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Render injeta a porta via variável PORT; local usa 8080
server.port=${PORT:8080}

# Banco e segredo podem vir de variáveis de ambiente (produção) ou de local.properties (local)
spring.datasource.url=${SPRING_DATASOURCE_URL:}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

app.jwt.secret=${APP_JWT_SECRET:}
app.jwt.expiration-minutes=120

# Em produção, defina APP_CORS_ALLOWED_ORIGINS com a URL do frontend no Vercel
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}